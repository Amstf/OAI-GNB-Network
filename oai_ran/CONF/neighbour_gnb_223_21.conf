############################################################
#  Bidirectional neighbour list for gNB_OAI_21 and 223      #
#                                                            #
#  Include this file from both configuration files so each   #
#  monolithic gNB knows about the other cell.  Always use    #
#      @include "CONF/neighbour_gnb_223_21.conf"            #
#  (libconfig rejects absolute paths here).  Adjust the      #
#  identifiers below if you change PCI, NR cell ID or        #
#  PLMN data, and mirror those values in each gNB config.    #
############################################################

neighbour_list = (
  ##########################################################
  #  gNB_OAI_21 (gNB_ID 21) sees gNB_OAI_223 as neighbour   #
  ##########################################################
  {
    nr_cellid = 101561221L;             # Cell identity broadcast by gNB_OAI_21
    neighbour_cell_configuration = (
      {
        gNB_ID              = 223;     # Remote gNB_ID advertised by gNB_OAI_223
        nr_cellid           = 1015612223L; # Remote cell identity (as configured on gNB_OAI_223)
        physical_cellId     = 223;     # PCI used by gNB_OAI_223 (update if you change physCellId)
        absoluteFrequencySSB= 641280;  # SSB ARFCN of the remote cell
        subcarrierSpacing   = 1;       # 30 kHz SSB numerology
        plmn                = { mcc = 1; mnc = 1; mnc_length = 2; };
        tracking_area_code  = 0x0001;  # TAC advertised by the neighbour
      }
    );
  },

  ##########################################################
  #  gNB_OAI_223 (gNB_ID 223) sees gNB_OAI_21 as neighbour  #
  ##########################################################
  {
    nr_cellid = 1015612223L;           # Cell identity broadcast by gNB_OAI_223
    neighbour_cell_configuration = (
      {
        gNB_ID              = 21;      # Remote gNB_ID advertised by gNB_OAI_21
        nr_cellid           = 101561221L; # Remote cell identity (gNB_OAI_21)
        physical_cellId     = 21;      # PCI used by gNB_OAI_21 (update if you change physCellId)
        absoluteFrequencySSB= 641280;  # Same SSB ARFCN as above
        subcarrierSpacing   = 1;       # 30 kHz SSB numerology
        plmn                = { mcc = 1; mnc = 1; mnc_length = 2; };
        tracking_area_code  = 0x0001;  # TAC advertised by the neighbour
      }
    );
  }
);
############################################################
#  No measurement configuration is required for manual HO. #
############################################################
